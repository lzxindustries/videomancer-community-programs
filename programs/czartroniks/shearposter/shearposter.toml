# Shearposter - Program Configuration
#
# Catalogue combo #110 (seed 20260925): pixelation + scanline shear
# + posterization.  See shearposter.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.shearposter"
program_name = "Shearposter"
program_version = "0.2.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pixel", "Glitch", "Color"]
program_type = "processing"
description = "Posterized, dithered pixel cells torn by a rolling zigzag or random tears; cells lean or slide, colour can split away."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cell"
value_labels = ["1 px", "2 px", "4 px", "8 px", "16 px", "32 px", "64 px", "128 px"]
initial_value_label = "4 px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
value_labels = ["1 line", "2 lines", "4 lines", "8 lines", "16 lines", "32 lines", "64 lines", "128 lines"]
initial_value_label = "16 lines"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Dither"
value_labels = ["Off", "2 px", "4 px", "8 px", "16 px", "32 px", "64 px", "Cell"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 176
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Luma"
value_labels = ["1 bit", "2 bits", "3 bits", "4 bits", "5 bits", "6 bits", "7 bits", "8 bits"]
initial_value_label = "2 bits"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Chroma"
value_labels = ["1 bit", "2 bits", "3 bits", "4 bits", "5 bits", "6 bits", "7 bits", "8 bits"]
initial_value_label = "4 bits"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shear"
value_labels = ["Zigzag", "Tear"]
initial_value_label = "Zigzag"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Shift"
value_labels = ["Free", "Cells"]
initial_value_label = "Free"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Cells"
value_labels = ["Lean", "Slide"]
initial_value_label = "Lean"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Edges"
value_labels = ["Fill", "Mirror"]
initial_value_label = "Mirror"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Colour"
value_labels = ["Together", "Split"]
initial_value_label = "Split"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Shear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 225
display_float_digits = 1
suffix_label = "%"

# Labelled knobs: preset values sit mid-zone (label k = 64 + 128 k).
# v0.1 presets keep their looks: Shear px -> P12 (HD), tear share -> K4.

[[preset]]
name = "Default"

[[preset]]
name = "Torn Mosaic"
rotary_potentiometer_1 = 576
rotary_potentiometer_2 = 448
rotary_potentiometer_4 = 717
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 438

[[preset]]
name = "Sliding Cells"
rotary_potentiometer_3 = 320
rotary_potentiometer_5 = 64
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 327

[[preset]]
name = "Two Bit Wave"
rotary_potentiometer_1 = 192
rotary_potentiometer_2 = 64
rotary_potentiometer_3 = 448
rotary_potentiometer_5 = 192
rotary_potentiometer_6 = 192

[[preset]]
name = "Misprint"
rotary_potentiometer_1 = 448
rotary_potentiometer_2 = 448
rotary_potentiometer_3 = 960
rotary_potentiometer_4 = 120
rotary_potentiometer_6 = 64
toggle_switch_9 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 400

[[preset]]
name = "Shredder"
rotary_potentiometer_1 = 320
rotary_potentiometer_2 = 192
rotary_potentiometer_4 = 1000
rotary_potentiometer_5 = 64
toggle_switch_7 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 900
