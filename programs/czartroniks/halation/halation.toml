# Halation - catalogue combo #5: bloom/glow + magnetic wobble.  See halation.vhd.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.halation"
program_name = "Halation"
program_version = "1.0.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Optics", "Film", "Signal"]
program_type = "processing"
description = "Bloom meets magnetic wobble: a wide glow that can wobble on its own, and a red halation halo that splits into twin ghosts."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Glow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 343
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Threshold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 345
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Radius"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 663
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Wobble"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 54
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 316
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Period"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 195
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Warp"
value_labels = ["Both", "Glow"]
initial_value_label = "Both"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Tint"
value_labels = ["Off", "Warm"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Energy"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Blend"
value_labels = ["Add", "Screen"]
initial_value_label = "Add"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Focus"
value_labels = ["Sharp", "Soft"]
initial_value_label = "Sharp"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Halo"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Warm Bloom"
rotary_potentiometer_1 = 800
rotary_potentiometer_2 = 400
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 0
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Loose Glow"
rotary_potentiometer_1 = 700
rotary_potentiometer_4 = 600
rotary_potentiometer_5 = 700
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "Dream"
rotary_potentiometer_1 = 600
rotary_potentiometer_2 = 300
rotary_potentiometer_3 = 1000
rotary_potentiometer_4 = 300
toggle_switch_11 = 1
linear_potentiometer_12 = 800
