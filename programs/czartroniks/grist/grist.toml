# Grist — the grain from Morsel's cookie dough, promoted to the whole
# instrument.
#
# Three hash octaves (per-pixel tooth, 4 px mottle, 8-64 px blocks) plus
# sparse pores feed one comparator: out = 512 + (Y - thr + grain) * gain.
# P12 DEVELOP rides the gain from transparent additive film grain up to a
# hard mezzotint where the picture re-renders itself as pure stipple
# density.  S7 chooses a frozen etching or living frame-seeded grain.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.grist"
program_version = "0.3.2"
abi_version = ">=1.0,<2.0"
program_name = "Grist"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Color", "Material", "Pattern"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Film grain to mezzotint: hash-grain octaves, pores and one develop comparator re-render the video as stipple."
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 204
display_min_value = 0
display_max_value = 100
name_label = "Fine"
suffix_label = "%"

