[program]
processing_delay_clks = 16
program_id = "com.czartroniks.pulp"
program_version = "1.0.3"
abi_version = ">=1.0,<2.0"
program_name = "Pulp"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Pattern", "Color"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "1965 newsprint press: rotated CMYK halftone screens, dot gain, misregistration, comic panels and bubbles. Press runs it."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 8
display_max_value = 96
name_label = "Screen"
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 256
display_min_value = 0
display_max_value = 100
name_label = "Shape"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 797
display_min_value = 0
display_max_value = 100
name_label = "Ink"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 101
