[program]
processing_delay_clks = 12
program_id = "com.czartroniks.pyre"
program_version = "1.0.4"
abi_version = ">=1.0,<2.0"
program_name = "Pyre"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Pattern", "Screen"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Simulated fire: advected temperature field with curl turbulence, buoyancy, entrainment; smoke, luma fuel, blue flame, overlay."

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Fuel"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 808
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 242
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Smoke"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 586
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Turblnce"
control_mode = "linear"
display_min_value = 0
