name = "Mirror Heat"
rotary_potentiometer_1 = 300
rotary_potentiometer_3 = 100
rotary_potentiometer_4 = 600
rotary_potentiometer_6 = 700
toggle_switch_9 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 300

