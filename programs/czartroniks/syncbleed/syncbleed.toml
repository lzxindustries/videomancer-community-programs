# Syncbleed - Program Configuration
#
# Catalogue combo #131 (seed 20260927): colour bleeding / NTSC dot crawl
# + sync loss / horizontal collapse.  Three knobs each; switches and
# slider set the interaction.  See syncbleed.vhd and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.syncbleed"
program_name = "Syncbleed"
program_version = "0.2.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Glitch", "Retro", "VHS"]
program_type = "processing"
description = "Chroma bleeds, lags and dot-crawls like a bad composite feed while rows collapse toward a seam under a rolling wave."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bleed"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 633
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Lag"
control_mode = "linear"
display_min_value = 0
display_max_value = 63
initial_value = 190
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Crawl"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Collapse"
control_mode = "linear"
display_min_value = 1
display_max_value = 9
initial_value = 704
display_float_digits = 2
suffix_label = "x"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Seam"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 716
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Wave"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 696
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Bleed"
value_labels = ["Before", "After"]
initial_value_label = "Before"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Length"
value_labels = ["Fixed", "Local"]
initial_value_label = "Local"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Chroma"
value_labels = ["Same", "Fringe"]
initial_value_label = "Same"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Crawl"
value_labels = ["Locked", "Drift"]
initial_value_label = "Locked"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Smear"
value_labels = ["Chroma", "Luma too"]
initial_value_label = "Chroma"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Loss"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Bad Cable"
rotary_potentiometer_1 = 700
rotary_potentiometer_2 = 400
rotary_potentiometer_3 = 600
rotary_potentiometer_4 = 0
rotary_potentiometer_6 = 0
toggle_switch_11 = 1

[[preset]]
name = "Breathing"
rotary_potentiometer_4 = 300
rotary_potentiometer_6 = 900
toggle_switch_7 = 1
toggle_switch_8 = 1

[[preset]]
name = "Total Loss"
rotary_potentiometer_1 = 500
rotary_potentiometer_4 = 500
rotary_potentiometer_5 = 700
toggle_switch_8 = 1
linear_potentiometer_12 = 1023
