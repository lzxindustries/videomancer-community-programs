[program]
processing_delay_clks = 8
program_id = "com.czartroniks.sidewinder"
program_version = "1.1.2"
abi_version = ">=1.0,<2.0"
program_name = "Sidewinder"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Warp", "Signal"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Per-scanline wave warp: the picture snakes left and right as a rolling wave, with twist, chroma split, mirror and wrap edges."
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 34
display_min_value = 0
display_max_value = 100
name_label = "Period"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 671
display_min_value = -100
display_max_value = 100
name_label = "Rate"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 336
display_min_value = 0
display_max_value = 100
name_label = "Ripple"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 263
display_min_value = -100
display_max_value = 100
name_label = "Twist"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 495
display_min_value = 0
display_max_value = 100
name_label = "Split"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023
display_min_value = 0
display_max_value = 100
name_label = "Mix"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shape"
value_labels = ["Triangle", "Sine"]
initial_value_label = "Triangle"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Swell"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Steps"
value_labels = ["Smooth", "Stepped"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Edge"
value_labels = ["Mirror", "Wrap"]
initial_value_label = "Wrap"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Bypass"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 198
display_min_value = 0
display_max_value = 100
name_label = "Amount"
suffix_label = "%"

