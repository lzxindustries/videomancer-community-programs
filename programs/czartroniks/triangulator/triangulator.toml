# Triangulator — triangle pixelation.
#
# Tiles the screen with a triangular lattice (alternating upright / inverted
# triangles) instead of square pixels.  Each triangle is flat-filled with a
# colour sampled from the incoming live video.  The P12 slider gives a very
# smooth size scale; optional grid lines, a luma lift/gate and colorization let
# the look be dialled in.  Forked from the mondrian / c64 cell-counter +
# line-buffer engines.

[program]
processing_delay_clks = 12
program_id = "com.czartroniks.triangulator"
program_version = "1.0.2"
abi_version = ">=1.0,<2.0"
program_name = "Triangulator"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pixel", "Pattern", "Color"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Triangle pixelation: video sampled into a lattice of upright/inverted triangles."
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Grid Colour"
value_labels = ["Black", "White", "Red", "Orange", "Yellow", "Green", "Blue", "Violet"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023
display_min_value = 0
display_max_value = 200
name_label = "Contrast"
suffix_label = "%"

# Gate off (S8): darker triangles are lifted to this level.
# Gate on: triangles below this level are hidden.  0 = no-op either way.
[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 126
display_min_value = 0
display_max_value = 100
name_label = "Luma Level"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Colorize"
value_labels = ["Original", "Duotone", "Posterize", "Hue Spin"]
initial_value_label = "Original"

# Per Colorize mode: Original = saturation (50% = unchanged), Duotone = colour
# pair (4 zones), Posterize = palette shift (top zone = grey), Hue Spin = angle.
[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023
display_min_value = 0
display_max_value = 100
name_label = "Colorize Param"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Line Width"
value_labels = ["Thin", "Medium", "Bold", "Heavy"]
initial_value_label = "Bold"

# --- Toggle Switches (7-11, binary) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Grid Lines"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Luma Gate"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Fill Mode"
# switch off (0) = faceted (per half-cell reads), on (1) = flat (left-cell read);
# labels were previously swapped vs the s_fill hardware sense.
value_labels = ["Faceted", "Flat"]
initial_value_label = "Flat"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Wireframe"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Bypass"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Fader 12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 95
display_min_value = 8
display_max_value = 256
name_label = "Triangle Size"
suffix_label = "px"

# --- Presets ---
# Remapped by hand to the v0.2 control layout; re-capture on hardware.

[[preset]]
name = "Fine Triangles"
rotary_potentiometer_1 = 0                 # black grid (unused, grid off)
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 0
rotary_potentiometer_4 = 0                 # Original
rotary_potentiometer_5 = 512               # saturation unchanged
rotary_potentiometer_6 = 300
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 0
linear_potentiometer_12 = 40               # ~18 px

[[preset]]
name = "Wireframe"
rotary_potentiometer_1 = 160               # white edges
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 490               # gate level ~400
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 500
toggle_switch_7 = 0
toggle_switch_8 = 1                        # luma gate -> only lit triangles' edges
toggle_switch_9 = 0
toggle_switch_10 = 1                       # wireframe: edges only, no fill
toggle_switch_11 = 0
linear_potentiometer_12 = 224              # ~63 px

[[preset]]
name = "Duotone Pop"
rotary_potentiometer_1 = 0
rotary_potentiometer_2 = 700               # punchier contrast
rotary_potentiometer_3 = 120               # slight black lift (gate off)
rotary_potentiometer_4 = 350               # Duotone
rotary_potentiometer_5 = 256               # duotone pair 2
rotary_potentiometer_6 = 300
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 0
linear_potentiometer_12 = 184              # ~53 px

[[preset]]
name = "Posterized"
rotary_potentiometer_1 = 0                 # black grid
rotary_potentiometer_2 = 600
rotary_potentiometer_3 = 0
rotary_potentiometer_4 = 620               # Posterize
rotary_potentiometer_5 = 0                 # rainbow palette, unshifted
rotary_potentiometer_6 = 400
toggle_switch_7 = 1                        # grid on
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 0
linear_potentiometer_12 = 152              # ~45 px
