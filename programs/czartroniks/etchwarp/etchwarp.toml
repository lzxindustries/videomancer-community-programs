# Etchwarp - catalogue combo #12: edge detect + value-noise warp + pixelation.  See etchwarp.vhd.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.etchwarp"
program_name = "Etchwarp"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Edges", "Pixel", "Noise"]
program_type = "processing"
description = "Edge lines over a noise-warped, pixelated picture: the noise can move the cells or the content, and the lines can trace blocks."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Threshold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 388
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Ink"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 864
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Noise"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 424
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 371
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Cells"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 452
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Rows"
value_labels = ["Square", "Wide", "Wider", "Strip"]
initial_value_label = "Strip"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Lines"
value_labels = ["Only", "Over"]
initial_value_label = "Over"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Noise Moves"
value_labels = ["Content", "Cells"]
initial_value_label = "Cells"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Pixelate"
value_labels = ["All", "Luma"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Line Colour"
value_labels = ["White", "Source"]
initial_value_label = "Source"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Edges From"
value_labels = ["Smooth", "Blocks"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Flow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 172
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Block Etch"
rotary_potentiometer_1 = 60
rotary_potentiometer_5 = 600
toggle_switch_7 = 0
toggle_switch_10 = 1

[[preset]]
name = "Boiling Grid"
rotary_potentiometer_3 = 700
rotary_potentiometer_5 = 500
toggle_switch_8 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Sharp Colour"
rotary_potentiometer_2 = 400
rotary_potentiometer_5 = 800
rotary_potentiometer_6 = 600
toggle_switch_9 = 1
toggle_switch_11 = 0
