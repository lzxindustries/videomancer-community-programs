# Ribbon — full-screen candy-ribbon stripes.
#
# A standalone fork of SUGARCOAT's "rainbow taffy" texture, blown up to fill
# the frame and grown into a full instrument.  Diagonal palette-ramp stripes
# are bent by a cross-axis triangle warp into waving ribbons, rounded and lit
# by a specular gloss, and can be mirrored into arrowheads, cross-woven into
# tartan, folded into ropes or wrapped in dark outlines.
#
# No video in — a pure generator.  WARP lives on the slider (squared, up to a
# fold-over climax); FLOW marches the stripes and sends the ripples travelling
# (centre = still).  Scale is exponential over 7 octaves; Warp, Scale,
# Palette and Ripple are all CONTINUOUS.
#
# Author: czartroniks

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.ribbon"
program_version = "1.0.2"
abi_version = ">=1.0,<2.0"
program_name = "Ribbon"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Color", "Render"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Full-screen glossy candy ribbons: flowing, warping palette stripes, chevrons, woven tartan and ropes."
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 894
display_min_value = 0
display_max_value = 180
name_label = "Angle"
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 856
