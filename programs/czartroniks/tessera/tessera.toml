# Tessera — tumbling triangles rain down the screen (line-buffer sprite engine).
#
# v1.0.0 (v17 engine): 1-64 triangles (K5), random in-plane orientation, uniform end-over-end
# tumble with flutter (side-to-side swing), shared spin (K2); P12 scales every
# triangle 0.25x-1.5x of its count's natural size (0.75/sqrt(count) of the
# screen); T10 depth layers; T11 two-sided video fill (back face = toned-down
# outline colour).  BG knob uses a toned-down palette.  Switches 7-9 unused.

[program]
processing_delay_clks = 8
program_id = "com.czartroniks.tessera"
program_version = "1.0.5"
abi_version = ">=1.0,<2.0"
program_name = "Tessera"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Render", "Demo"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Equilateral triangles tumble end-over-end and rain down the screen as outlines."
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 498
display_min_value = 0
display_max_value = 100
name_label = "Outline Color"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
