# --- Linear Potentiometer (Fader 12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023
display_min_value = 0
display_max_value = 100
name_label = "Scale"
suffix_label = "%"

[firmware]
# nextpnr placement seed for the stock LZX build (one seed, all 8 configs):
# seeds 1-6 each hung nextpnr's router1 (a rip-up livelock) in at least one
# config up to v1.0.4; v1.0.5 removed the duplicate-input LUTs behind it.
# Seed 7 builds all 8 (v1.0.5 own HD timing 80.0/85.3/77.4 MHz Analog/HDMI/Dual).
seed = 7
