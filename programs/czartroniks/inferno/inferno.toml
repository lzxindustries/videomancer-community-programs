[program]
processing_delay_clks = 24
program_id = "com.czartroniks.inferno"
program_version = "2.0.3"
abi_version = ">=1.0,<2.0"
program_name = "Inferno"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Pattern", "Screen"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Pixelated two-layer noise fire: K2 block size, 32-step palette, rolling smoke, Canny luma-edge mode, blue flame, overlay."

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Fuel"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 767
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Pixels"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Smoke"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 419
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Turblnce"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 685
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Depth/Edge"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
