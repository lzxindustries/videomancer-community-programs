# Cleave — dark/light split re-texturizer.  The picture is posterized into 8
# luma levels and cleaved into dark and light territory; dark areas are redrawn
# as serrated thermal scan-bands (white/black bars 3x the width of the color
# stripes), light areas as TV static whose density follows the source.  The
# Flip fader rotates the assignment: mid-travel bands the luma extremes and
# statics the midtones (solarized), full travel is the exact inversion.  A
# black outline traces the boundary between the two textures.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.cleave"
program_version = "0.10.3"
abi_version = ">=1.0,<2.0"
program_name = "Cleave"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Color", "Pattern", "Glitch"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Dark/light cleave: darks become serrated thermal bands, lights TV static, black outline between; fader flips the worlds."
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---
# K1-K3 shape the DARK texture (thermal bands), K4-K6 the LIGHT one (static).

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 632
display_min_value = 0
display_max_value = 100
name_label = "Band Size"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 899
display_min_value = 0
display_max_value = 100
name_label = "Wave"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 796
display_min_value = -100
display_max_value = 100
name_label = "Drift"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Static Size"
value_labels = ["Fine", "Medium", "Coarse", "Chunky"]
initial_value_label = "Coarse"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 337
display_min_value = 0
display_max_value = 100
name_label = "Boil Rate"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 408
display_min_value = 0
display_max_value = 100
name_label = "Fringe"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

