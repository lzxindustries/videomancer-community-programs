# Snowglobe - Program Configuration
#
# Catalogue combo #68 (seed 20260922): pixelation + RF noise / snow / VHS
# tracking + polar warp.  See snowglobe.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.snowglobe"
program_name = "Snowglobe"
program_version = "0.2.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Retro", "Distortion", "VHS"]
program_type = "processing"
description = "Pixelated cells (lens or screen space) through a sphere or tunnel lens, with per-cell or fine snow and lost-tracking lines."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cell"
value_labels = ["1 px", "2 px", "4 px", "8 px", "16 px", "32 px", "64 px", "128 px"]
initial_value_label = "4 px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
value_labels = ["1 line", "2 lines", "4 lines", "8 lines", "16 lines", "32 lines", "64 lines", "128 lines"]
initial_value_label = "128 lines"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Snow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 509
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Tracking"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 70
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Bulge"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 699
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Radius"
control_mode = "linear"
display_min_value = 3
display_max_value = 140
initial_value = 586
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Cells"
value_labels = ["Lens", "Screen"]
initial_value_label = "Lens"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Snow"
value_labels = ["Fine", "Cells"]
initial_value_label = "Fine"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Lens"
value_labels = ["Sphere", "Tunnel"]
initial_value_label = "Sphere"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Edges"
value_labels = ["Black", "Mirror"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Snow"
value_labels = ["Mono", "Colour"]
initial_value_label = "Mono"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Squeeze"
control_mode = "linear"
display_min_value = 50
display_max_value = 200
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

# Presets are hand-written (v0.1 looks, K1/K2 remapped to the 8-step labels);
# recapture them from hardware with capture_preset.sh.

[[preset]]
name = "Default"

[[preset]]
name = "Chunky Storm"
rotary_potentiometer_1 = 704
rotary_potentiometer_2 = 576
rotary_potentiometer_3 = 760
toggle_switch_8 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "Mosaic Tunnel"
rotary_potentiometer_1 = 448
rotary_potentiometer_2 = 192
rotary_potentiometer_5 = 1000
rotary_potentiometer_6 = 1023
toggle_switch_7 = 1
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 200

[[preset]]
name = "Bad Reception"
rotary_potentiometer_1 = 192
rotary_potentiometer_2 = 64
rotary_potentiometer_4 = 500
rotary_potentiometer_5 = 512
linear_potentiometer_12 = 340

[[preset]]
name = "Lost Channel"
rotary_potentiometer_3 = 1023
rotary_potentiometer_4 = 300

[firmware]
# nextpnr placement seed for the stock LZX build (one seed, all 8 configs):
# lower seeds hung nextpnr's router1 (a rip-up livelock) in at least one
# config; seed 3 builds all 8.
seed = 3
