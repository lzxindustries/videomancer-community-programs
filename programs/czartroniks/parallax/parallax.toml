# Parallax - Program Configuration
#
# Two catalogue effects (seed 20260918): depth-from-luma parallax and
# colour channel swap / offset.  Three knobs each; switches and slider
# set the interaction.  See parallax.vhd.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.parallax"
program_name = "Parallax"
program_version = "0.2.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Distortion", "Colorizer", "Glitch"]
program_type = "processing"
description = "Luma becomes depth: bright and dark shift sideways as the camera sways; chroma reads at its own offsets, channels swap."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1013
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Sway"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 641
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Focus"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 808
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Swap"
value_labels = ["Off", "U<>V", "Y>U", "U>Y", "Y<>V", "Rotate", "Rotate Back", "Complement"]
initial_value_label = "Complement"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Offset"
control_mode = "linear"
display_min_value = -128
display_max_value = 128
initial_value = 933
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Split"
control_mode = "linear"
display_min_value = 0
display_max_value = 127
initial_value = 0
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Depth"
value_labels = ["Luma", "Sat"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Near"
value_labels = ["Bright", "Dark"]
initial_value_label = "Bright"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Chroma"
value_labels = ["Moves", "Stays"]
initial_value_label = "Moves"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Sway"
value_labels = ["Glide", "Wiggle"]
initial_value_label = "Glide"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Edges"
value_labels = ["Fill", "Wrap"]
initial_value_label = "Fill"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Position"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Relief Map"
rotary_potentiometer_1 = 700
rotary_potentiometer_2 = 250
rotary_potentiometer_3 = 500
toggle_switch_11 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Colour Ghost"
rotary_potentiometer_1 = 500
rotary_potentiometer_5 = 800
rotary_potentiometer_6 = 300
toggle_switch_9 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Rotated"
rotary_potentiometer_1 = 300
rotary_potentiometer_4 = 700
rotary_potentiometer_5 = 300
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 800
