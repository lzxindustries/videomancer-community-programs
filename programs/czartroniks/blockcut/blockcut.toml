# Blockcut - Program Configuration
#
# Two catalogue effects (seed 20260917): edge detect and datamosh / block
# displacement.  Three knobs each; switches and slider set the
# interaction.  See blockcut.vhd.
#
# v0.2.0: the picture is cut by the same blocks (Blend 100% = cut-up picture
# with the edges over it); continuous Block size; re-roll re-randomizes;
# exponential Rate; Density/Shift floors keep every control live.
# Block/Rate values were remapped so defaults and presets keep their old
# block size and re-roll speed (16 px = 150, 32 px = 440; 41 fields = 240,
# 16 fields = 430).
#
# v0.3.0: 3x3 Sobel edges (thicker, smoother lines, same Gain calibration);
# colour-only blocks -- half as many again as Density keep their luma and
# take their colour from the displaced spot (codec-error look).

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.blockcut"
program_name = "Blockcut"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Edge", "Glitch", "Grid"]
program_type = "processing"
description = "Sobel edge drawing and picture cut into hashed blocks that shift, hold, invert or borrow colour; density on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 661
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Thresh"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 289
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Blend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 61
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Block"
control_mode = "linear"
display_min_value = 8
display_max_value = 64
initial_value = 227
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Shift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 496
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Rate"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 637
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Edges"
value_labels = ["White", "Tinted"]
initial_value_label = "White"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Blocks"
value_labels = ["Plain", "Negative"]
initial_value_label = "Plain"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Hash"
value_labels = ["Block", "Band"]
initial_value_label = "Block"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Mosh"
value_labels = ["Shift", "Hold"]
initial_value_label = "Hold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Ink"
value_labels = ["Light", "Dark"]
initial_value_label = "Light"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Density"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 283
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Shattered"
rotary_potentiometer_1 = 600
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 800
rotary_potentiometer_6 = 430
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Smeared Ink"
rotary_potentiometer_2 = 150
rotary_potentiometer_3 = 400
rotary_potentiometer_4 = 440
rotary_potentiometer_5 = 200
toggle_switch_10 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "Bar Code"
rotary_potentiometer_1 = 500
rotary_potentiometer_4 = 150
rotary_potentiometer_5 = 1023
toggle_switch_9 = 1
linear_potentiometer_12 = 800
