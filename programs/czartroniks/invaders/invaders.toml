# Wizard Invaders
#
# Videomancer-themed Space Invaders: a marching 3x6 wave of CRT-TV aliens,
# 4 destructible bunkers, the wizard slid by the fader, wand-shots fired on
# any change of Switch 7, pixel-accurate collisions, arcade cellophane overlay.

[program]
processing_delay_clks = 12
program_id = "com.czartroniks.invaders"
program_name = "Invaders"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Game", "Pattern"]
program_type = "processing"
description = "Space Invaders: 3x6 CRT-TV alien wave, destructible bunkers, fader-driven wizard, fire on any Switch 7 edge"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bomb Rate"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Trail"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 640
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Alien Spd"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 410
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Bomb Drop Spd"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Shot Spd"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Fire"
value_labels = ["A", "B"]
initial_value_label = "A"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "BG"
value_labels = ["Video", "Black"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Overlay"
value_labels = ["Solid", "Cellophane"]
initial_value_label = "Cellophane"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Pause"
value_labels = ["Run", "Pause"]
initial_value_label = "Run"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Reset"
value_labels = ["Run", "Reset"]
initial_value_label = "Run"

# --- Linear Fader (12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Ship X"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

# --- Presets ---
# Hand-written placeholders; capture real ones on hardware with
# ./capture_preset.sh once the controls are signed off.

[[preset]]
name = "Arcade"

[[preset]]
name = "Onslaught"
rotary_potentiometer_1 = 1023
rotary_potentiometer_4 = 768
rotary_potentiometer_5 = 768
rotary_potentiometer_6 = 896

[[preset]]
name = "Video Raid"
rotary_potentiometer_2 = 1023
rotary_potentiometer_3 = 448
toggle_switch_8 = 0
toggle_switch_9 = 0
