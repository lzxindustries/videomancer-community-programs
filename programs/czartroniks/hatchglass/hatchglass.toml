# Hatchglass - Program Configuration
#
# Catalogue combo #93 (seed 20260924): kaleidoscope + crosshatch + key.
# See hatchglass.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.hatchglass"
program_name = "Hatchglass"
program_version = "0.3.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Geometry", "Stylize", "Keyer"]
program_type = "processing"
description = "Kaleidoscope panes redrawn as tonal crosshatch; the slider sweeps a luma or saturation key from picture to full engraving"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Ink"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 128
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Slide"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 108
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Weight"
control_mode = "linear"
display_min_value = 9
display_max_value = 69
initial_value = 148
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 336
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 610
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Soft"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 304
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Key"
value_labels = ["Luma", "Sat"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Space"
value_labels = ["Screen", "Glass"]
initial_value_label = "Screen"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Paper"
value_labels = ["White", "Over"]
initial_value_label = "White"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Fold"
value_labels = ["Mirror", "Repeat"]
initial_value_label = "Mirror"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Engrave"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 577
display_float_digits = 0
suffix_label = "%"

# Presets are hand-mapped from v0.1/v0.2 (pane widths, pitch and key level
# kept); re-capture from the hardware with ./capture_preset.sh.

[[preset]]
name = "Default"

[[preset]]
name = "Etched Mirrors"
rotary_potentiometer_3 = 520
rotary_potentiometer_5 = 666
linear_potentiometer_12 = 1023

[[preset]]
name = "Dark Keyed"
rotary_potentiometer_5 = 155
rotary_potentiometer_6 = 700
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 397

[[preset]]
name = "Sat Tiles"
rotary_potentiometer_4 = 848
rotary_potentiometer_5 = 666
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 607

[[preset]]
name = "Leaded Glass"
rotary_potentiometer_3 = 620
rotary_potentiometer_4 = 620
rotary_potentiometer_5 = 520
toggle_switch_9 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Reeded Glass"
rotary_potentiometer_2 = 512
rotary_potentiometer_5 = 1023
