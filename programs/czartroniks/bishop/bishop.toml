[firmware]
# nextpnr placement seed for the stock LZX build (one seed, all 8 configs):
# v1.0.3 (resolution scaling): seed 3 crashes nextpnr's router; seed 1 builds
# all 8 (own HD timing 82.7/86.3/76.6 MHz Analog/HDMI/Dual).
seed = 1
