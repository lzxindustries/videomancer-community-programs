# Subsample - Program Configuration
#
# Two catalogue effects (seed 20260918): datamosh / block displacement and
# chroma subsampling artifacts (4:1:1, 4:2:0, composite).  Three knobs each;
# switches and slider set the interaction.  See subsample.vhd.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.subsample"
program_name = "Subsample"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Signal", "Glitch", "Pixel"]
program_type = "processing"
description = "Chroma held in strips or squares, bled and dot-crawling like a bad composite feed, cut into hashed blocks that shift or hold."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Block"
control_mode = "linear"
display_min_value = 8
display_max_value = 64
initial_value = 961
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Rate"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 362
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hold"
control_mode = "linear"
display_min_value = 1
display_max_value = 64
initial_value = 817
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Bleed"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 1023
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Crawl"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Blocks"
value_labels = ["Shift", "Hold"]
initial_value_label = "Shift"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Chroma"
value_labels = ["After", "Before"]
initial_value_label = "After"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Crawl"
value_labels = ["Checker", "Bars"]
initial_value_label = "Bars"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Moshed"
value_labels = ["Colour", "Grey"]
initial_value_label = "Colour"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Hold Shape"
value_labels = ["Line", "Square"]
initial_value_label = "Square"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Density"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 67
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "VHS Dub"
rotary_potentiometer_1 = 439
rotary_potentiometer_2 = 162
rotary_potentiometer_4 = 240
rotary_potentiometer_5 = 600
rotary_potentiometer_6 = 500
linear_potentiometer_12 = 107

[[preset]]
name = "Broken Codec"
rotary_potentiometer_1 = 0
rotary_potentiometer_2 = 695
rotary_potentiometer_3 = 112
rotary_potentiometer_4 = 496
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_10 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 589

[[preset]]
name = "Dot Crawl"
rotary_potentiometer_4 = 16
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 900
toggle_switch_9 = 1
linear_potentiometer_12 = 0
