# Feedback — a digital camera-at-the-monitor loop.  Last frame's output is
# averaged into a coarse store (128x64 luma, 64x32 chroma, two banks) and
# read back through a per-pixel zoom / rotate / drift transform with
# bilinear interpolation, so echoes are smooth at full resolution.  Live
# video is keyed / mixed / added / lightened over the echoes, and each
# generation passes through gain (folding above unity), hue rotation,
# crisp contrast and negative before it goes back into the store.

[program]
processing_delay_clks = 12
program_id = "com.czartroniks.feedback"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
program_name = "Feedback"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Temporal", "Warp", "Mirror"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Video feedback loop: zoom/rotate/drift tunnels, hue cycling, key/mix/add/lighten, fold overdrive, mirror, negative."
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 330
display_min_value = -100
display_max_value = 100
name_label = "Zoom"
suffix_label = "%"

