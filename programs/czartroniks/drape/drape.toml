[program]
processing_delay_clks = 12
program_id = "com.czartroniks.drape"
program_version = "1.3.2"
abi_version = ">=1.0,<2.0"
program_name = "Drape"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Warp", "Pattern"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Captures a scanline and drapes it down like fabric: perspective fan or pleats, lean, sway and fade to black."

# --- Rotary Potentiometers (Knobs 1-6) ---
# Row 1 (K1-K3): vertical structure -- Split / Stretch / Fade
# Row 2 (K4-K6): motion + shape     -- Twist / Onset   / Sway

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Split"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 504
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Stretch"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 347
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Fade"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 615
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Twist"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 492
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Onset"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Sway"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 649
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Blur"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Shape"
value_labels = ["Fan", "Pleat"]
initial_value_label = "Fan"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Freeze"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Bypass"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Spread"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 578
display_min_value = 0
display_max_value = 100
suffix_label = "%"

