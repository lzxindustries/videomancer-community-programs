# IRIS -- perspective dot-tunnel eye with a three-layer colour split.
#
# A large iris circle nearly fills the screen; a dark pupil sits anywhere
# inside it.  Hundreds of round dots on spiral arms sweep from the pupil to
# the rim, born as pinpoints and growing geometrically, squeezed on the side
# where the pupil is near the rim and fanning wide on the far side -- a cone
# seen in perspective, so steering the pupil tilts the whole tunnel in 3D.
# The field is drawn three times (red, green, blue) as transparent light
# layers; SPLIT fans them apart with distance from the pupil, from white
# cores with coloured crescents to clean primaries at the rim.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.iris"
program_version = "1.4.3"
abi_version = ">=1.0,<2.0"
program_name = "Iris"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Optics"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Perspective spiral dot tunnel: pupil-steered iris of growing round dots, RGB layers split by distance, ink and flow modes"
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 454
display_min_value = -100
display_max_value = 100
name_label = "Pupil X"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 446
display_min_value = -100
