# Revenant — "Ghost in the Signal": analog luma-contour glitch.
#
# Re-draws a live source as a degrading analog signal: bright parts of the figure
# are redrawn by swarms of thin electric contour lines that hug the volume, dark
# parts fall into true black, the eyes blow out into a solid icy fill, and the whole
# image frays / fringes / jitters under the P12 master "signal decay" fader.
# Streaming pixel pipeline (no frame buffer) forked from the triangulator engine.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.revenant"
program_version = "1.0.3"
abi_version = ">=1.0,<2.0"
program_name = "Revenant"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Color", "Pattern", "Glitch"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Ghost in the Signal: luma-driven electric contour redraw with analog signal-decay glitch."
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 432
display_min_value = 0
display_max_value = 100
name_label = "Luma Key"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 107
display_min_value = 0
display_max_value = 100
name_label = "Line Density"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 350
display_min_value = 0
display_max_value = 100
name_label = "Contrast"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue Rotate"
value_labels = ["Violet", "Cyan", "Amber", "Green"]
