# Orbifold — iterated fract-ring rosette fractal.
#
# The classic two-line shader — uv = fract(uv * k); ring if t < |uv| < t+w —
# iterated across 6 power-of-two scales.  Interlocking rosettes in 8 shapes,
# a seamless constant-rate zoom, per-level orbit + radius pulse on the
# slider, and live video as a fractal halftone (luma fattens the rings).

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.orbifold"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
program_name = "Orbifold"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Generative", "Demo"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Iterated fract-ring fractal: rosettes in 8 shapes across 6 scales, seamless zoom, orbit + pulse animation."
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Shape"
value_labels = ["Circle", "Square", "Diamond", "Octagon", "Star", "Sparkle", "Cross", "Mixed"]
initial_value_label = "Diamond"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 318
name_label = "Radius"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 516
name_label = "Thickness"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Depth"
value_labels = ["1", "2", "3", "4", "5", "6"]
initial_value_label = "3"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 608
display_min_value = 0
display_max_value = 100
name_label = "Scale"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 180
display_min_value = -100
display_max_value = 100
name_label = "Zoom"
suffix_label = "%"

# --- Toggle Switches (7-11, binary) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Centres"
value_labels = ["Corners", "Middles"]
initial_value_label = "Corners"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Fill"
value_labels = ["Rings", "Discs"]
initial_value_label = "Rings"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Video"
value_labels = ["Off", "Weight"]
initial_value_label = "Weight"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Overlap"
value_labels = ["Stack", "XOR"]
initial_value_label = "XOR"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Palette"
value_labels = ["Rainbow", "Phosphor"]
initial_value_label = "Rainbow"

# --- Linear Potentiometer (Fader 12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 781
display_min_value = 0
display_max_value = 100
name_label = "Animate"
suffix_label = "%"

