# Glitchscape — "Pixel-Sort Landscape": databend a live source into a dense
# rectangular mass of vertically-streaked, hyper-saturated jewel-tone color on a
# flat teal field, with blown-white hot-zones, fine branching white contour
# filaments, a jagged torn top edge and columns that drip downward.
#
# A STREAMING pipeline (no frame buffer) forked from the revenant engine: the
# bright parts of the source become the colored mass, dark parts fall to the teal
# sky.  Vertical "sorted" streaks are iso-bars of a luma-bowed height field whose
# hue is column-locked (each bar a different jewel tone), so the mass reads as a
# corrupted JPEG / pixel-sorted mountain range melting into colored rain.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.glitchscape"
program_version = "1.0.2"
abi_version = ">=1.0,<2.0"
program_name = "Glitchscape"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Color", "Pattern", "Glitch"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Pixel-sort landscape: live source databent into vertical jewel-tone streaks on teal, with hot-zones, white filaments and drips."
url = "https://github.com/lzxindustries/videomancer-community-programs"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 702
display_min_value = 0
display_max_value = 100
name_label = "Mass Key"
suffix_label = "%"

